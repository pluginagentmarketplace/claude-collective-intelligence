global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'postgres'
    static_configs:
      - targets: ['agent_postgres_exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['agent_redis_exporter:9121']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['agent_rabbitmq:15692']
